[project]
name = "spider-venom-ha"
version = "0.3.0"
description = "Home Assistant custom integration for Spider Grills controllers (Venom, Giant Huntsman)"
requires-python = ">=3.13.2,<3.14"
dependencies = []

[dependency-groups]
dev = [
    # Pins Home Assistant 2026.2.3 and the matching test harness.
    "pytest-homeassistant-custom-component==0.13.316",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
